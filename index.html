<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Planet Hop</title>
<meta name="description" content="A tap-and-explore solar system adventure for little space explorers.">
<meta name="theme-color" content="#2A1B5E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Planet Hop">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/fredoka-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face {
  font-family: 'Fredoka';
  src: url(fonts/fredoka-latin.woff2) format('woff2');
  font-weight: 500 700;
  font-display: swap;
}
:root {
  --ink: #170F3D;
  --plum: #2A1B5E;
  --plum-2: #3A2A80;
  --marigold: #FFC23C;
  --bubblegum: #FF5C9A;
  --mint: #5FE0C1;
  --cream: #FFF4D6;
  --dark: #22143F;
  --cut: 0 .4vmin 0 rgba(18, 10, 48, .55);
  --pc: #FFC23C;           /* current planet colour, set by JS */
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; height: 100%; overflow: hidden;
  touch-action: none; overscroll-behavior: none;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
body {
  font-family: 'Fredoka', ui-rounded, 'Arial Rounded MT Bold', system-ui, sans-serif;
  font-weight: 600;
  color: var(--cream);
  background:
    radial-gradient(60vmax 45vmax at 85% 10%, rgba(255, 92, 154, .16), transparent 70%),
    radial-gradient(55vmax 40vmax at 15% 95%, rgba(95, 224, 193, .12), transparent 70%),
    radial-gradient(120vmax 90vmax at 50% 50%, var(--plum), var(--ink));
}
button {
  font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer;
  touch-action: manipulation;
}
button:focus-visible { outline: 4px solid var(--mint); outline-offset: 4px; }
svg { display: block; }

/* ---------- sky ---------- */
#sky { position: fixed; inset: 0; pointer-events: none; }
#sky .dots { position: absolute; left: 0; top: 0; width: 2px; height: 2px; border-radius: 50%; }
#sky .tw { position: absolute; width: 2.6vmin; height: 2.6vmin; animation: twinkle 3.2s ease-in-out infinite; }
@keyframes twinkle { 0%, 100% { opacity: .25; transform: scale(.6); } 50% { opacity: 1; transform: scale(1); } }

#shooting {
  position: fixed; z-index: 6; width: 26vmin; height: 12vmin; left: 0; top: 0;
  display: none; pointer-events: auto;
}
#shooting svg { width: 100%; height: 100%; overflow: visible; }

/* ---------- screens ---------- */
.screen { position: fixed; inset: 0; opacity: 0; visibility: hidden; transition: opacity .35s ease, visibility 0s linear .35s; }
.screen.on { opacity: 1; visibility: visible; transition: opacity .35s ease; }

/* round chunky buttons */
.round {
  width: clamp(52px, 11vmin, 88px); height: clamp(52px, 11vmin, 88px);
  border-radius: 50%; display: grid; place-items: center;
  box-shadow: var(--cut), inset 0 -.6vmin 0 rgba(0, 0, 0, .14);
  border: .55vmin solid var(--cream);
  transition: transform .12s ease;
}
.round:active { transform: translateY(.4vmin) scale(.96); }
.round svg { width: 58%; height: 58%; }
.btn-home { background: var(--marigold); }
.btn-arrow { background: var(--bubblegum); }
.btn-sound { background: var(--plum-2); }
.btn-book { background: var(--mint); position: relative; }
.btn-book .count {
  position: absolute; right: -6%; bottom: -6%; min-width: 44%; height: 44%; padding: 0 .6vmin;
  display: grid; place-items: center; border-radius: 99px;
  background: var(--bubblegum); color: #fff; font-size: clamp(13px, 2.6vmin, 20px); font-weight: 700;
  border: .4vmin solid var(--cream);
}
.btn-sound .off { display: none; }
body.muted .btn-sound .on-i { display: none; }
body.muted .btn-sound .off { display: block; }

/* ---------- intro ---------- */
#intro { display: grid; place-items: center; }
.intro-wrap { display: flex; flex-direction: column; align-items: center; gap: 2vmin; }
.wordmark {
  font-size: clamp(54px, 15vmin, 160px); font-weight: 700; line-height: .95; letter-spacing: .01em;
  display: flex; gap: .02em; white-space: nowrap;
}
.wordmark span {
  display: inline-block; color: var(--c);
  -webkit-text-stroke: .07em var(--cream); paint-order: stroke fill;
  text-shadow: 0 .07em 0 var(--ink);
  transform: rotate(var(--r, 0deg)) translateY(var(--y, 0));
}
.wordmark .gap { width: .3em; }
#launchpad { position: relative; width: clamp(110px, 24vmin, 220px); height: clamp(170px, 40vmin, 360px); }
#launchpad .rocket-svg { width: 100%; height: 100%; animation: bob 2.4s ease-in-out infinite; }
#launchpad .ring {
  position: absolute; left: 50%; top: 45%; width: 130%; aspect-ratio: 1; translate: -50% -50%;
  border-radius: 50%; border: .7vmin dashed rgba(255, 244, 214, .55);
  animation: spin 14s linear infinite;
}
.intro-hint { font-size: clamp(18px, 4.2vmin, 34px); color: var(--cream); opacity: .9; }
.intro-hint b { color: var(--marigold); font-weight: 700; }
#countdown {
  position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none;
  font-size: 40vmin; font-weight: 700; color: var(--marigold);
  -webkit-text-stroke: .04em var(--cream); paint-order: stroke fill; text-shadow: 0 .04em 0 var(--ink);
}
#countdown span { animation: countPop .9s ease-out both; }
@keyframes countPop { 0% { transform: scale(.2); opacity: 0; } 30% { transform: scale(1.1); opacity: 1; } 70% { transform: scale(1); opacity: 1; } 100% { transform: scale(1.3); opacity: 0; } }
#launchpad.shake .rocket-svg { animation: shake .09s linear infinite; }
#launchpad.launch .rocket-svg { animation: launch 1.1s cubic-bezier(.55, 0, .9, .4) forwards; }
@keyframes shake { 0% { transform: translate(-2px, 0); } 50% { transform: translate(2px, 1px); } 100% { transform: translate(-2px, 0); } }
@keyframes launch { to { transform: translateY(-130vh); } }
.puff { position: absolute; border-radius: 50%; background: var(--cream); opacity: .9; pointer-events: none; }

/* ---------- map ---------- */
#map { overflow: hidden; }
#stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
#stage.zooming { transition: transform .75s cubic-bezier(.6, 0, .3, 1); }
#orbits { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
#orbits circle { fill: none; stroke: var(--cream); stroke-opacity: .3; stroke-width: 4; stroke-dasharray: 1 16; stroke-linecap: round; }
#bigsun { position: absolute; cursor: pointer; border-radius: 50%; }
#bigsun svg { width: 100%; height: 100%; overflow: visible; }
.mp {
  position: absolute; left: 0; top: 0; cursor: pointer; will-change: transform;
  border-radius: 50%;
}
.mp .planet-svg { width: 100%; height: 100%; overflow: visible; transition: transform .25s; }
.mp.picked .planet-svg { animation: pickBounce .5s ease-out; }
@keyframes pickBounce { 0% { transform: scale(1); } 35% { transform: scale(1.25); } 70% { transform: scale(.95); } 100% { transform: scale(1.08); } }
.mp .label {
  position: absolute; left: 50%; top: calc(100% + 10px); translate: -50% 0;
  font-size: 30px; line-height: 1; padding: 6px 16px 8px; border-radius: 99px; white-space: nowrap;
  background: var(--plum-2); border: 4px solid var(--cream); color: var(--cream);
  box-shadow: 0 5px 0 rgba(18, 10, 48, .55);
}
.mp.p-saturn .label { top: calc(100% + 22px); }
.mp .badge { position: absolute; right: -6%; top: -8%; width: 38%; height: 38%; display: none; z-index: 2;
  filter: drop-shadow(0 4px 0 rgba(18, 10, 48, .55)); }
.mp.has-sticker .badge { display: block; }
.mp .hit { position: absolute; inset: -22%; border-radius: 50%; }
#maprocket { position: absolute; left: 0; top: 0; width: 90px; height: 142px; pointer-events: auto; cursor: pointer; z-index: 5; }
#maprocket .rocket-svg { width: 100%; height: 100%; }
#maprocket.idle .rocket-svg { animation: bob 2.4s ease-in-out infinite; }
#maprocket .flame { opacity: .0; transition: opacity .2s; }
#maprocket.flying .flame { opacity: 1; }
.trail { position: absolute; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; pointer-events: none; z-index: 4; }

.map-hud { position: absolute; top: max(2vmin, env(safe-area-inset-top)); right: max(2vmin, env(safe-area-inset-right)); display: flex; gap: 1.6vmin; z-index: 8; }
.map-title {
  position: absolute; left: 50%; translate: -50% 0; top: max(2.2vmin, env(safe-area-inset-top)); z-index: 7; pointer-events: none;
  font-size: clamp(20px, 5vmin, 44px); font-weight: 700; color: var(--cream); white-space: nowrap;
  text-shadow: 0 .08em 0 var(--ink);
}
@media (orientation: portrait) {
  .map-title { display: none; }
}

/* ---------- detail ---------- */
#detail {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  grid-template-rows: auto minmax(0, 1fr) auto;
  grid-template-areas: "top top top" "fl planet fr" "bottom bottom bottom";
  padding: max(2vmin, env(safe-area-inset-top)) max(2.5vmin, env(safe-area-inset-right)) max(2vmin, env(safe-area-inset-bottom)) max(2.5vmin, env(safe-area-inset-left));
}
.d-top { grid-area: top; display: flex; align-items: center; justify-content: space-between; gap: 2vmin; }
.d-top .right { display: flex; gap: 1.6vmin; }
.d-title { display: flex; flex-direction: column; align-items: center; gap: .4vmin; min-width: 0; }
.d-name {
  font-size: clamp(38px, 10.5vmin, 110px); font-weight: 700; line-height: 1; white-space: nowrap;
  display: flex;
}
.d-name span {
  display: inline-block; color: var(--pc);
  -webkit-text-stroke: .08em var(--cream); paint-order: stroke fill;
  text-shadow: 0 .07em 0 var(--ink);
}
.d-name.drop span { animation: letterDrop .55s cubic-bezier(.3, 1.6, .5, 1) both; animation-delay: calc(var(--i) * 70ms); }
@keyframes letterDrop { from { transform: translateY(-60%) scale(.4); opacity: 0; } to { transform: none; opacity: 1; } }
.stars { display: flex; gap: 1vmin; }
.stars i { width: clamp(18px, 4.4vmin, 36px); height: clamp(18px, 4.4vmin, 36px); display: block; }
.stars i svg { width: 100%; height: 100%; }
.stars i path { fill: rgba(255, 244, 214, .22); transition: fill .3s; }
.stars i.lit path { fill: var(--marigold); }
.stars i.lit { animation: starPop .5s ease-out; }
@keyframes starPop { 40% { transform: scale(1.6) rotate(20deg); } }

.d-planet { grid-area: planet; display: grid; place-items: center; min-height: 0; position: relative; }
#bigplanet {
  width: min(58vh, 40vw); aspect-ratio: 1; cursor: pointer; position: relative; border-radius: 50%;
}
#bigplanet .planet-svg { width: 100%; height: 100%; overflow: visible; }
#bigplanet.pop { animation: planetIn .7s cubic-bezier(.3, 1.5, .5, 1) both; }
@keyframes planetIn { from { transform: scale(.25); opacity: 0; } to { transform: none; opacity: 1; } }
#bigplanet.out-l { animation: outL .35s ease-in forwards; }
#bigplanet.out-r { animation: outR .35s ease-in forwards; }
@keyframes outL { to { transform: translateX(-60vw) scale(.5); opacity: 0; } }
@keyframes outR { to { transform: translateX(60vw) scale(.5); opacity: 0; } }

.facts { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 5vh; }
.facts.l { grid-area: fl; } .facts.r { grid-area: fr; }
.orb {
  --s: clamp(64px, min(17vh, 12vw), 132px);
  width: var(--s); height: var(--s); border-radius: 50%; position: relative;
  display: grid; place-items: center; font-size: calc(var(--s) * .46); line-height: 1;
  background: radial-gradient(circle at 35% 30%, rgba(255, 255, 255, .28), transparent 55%), var(--plum-2);
  border: calc(var(--s) * .07) solid var(--pc);
  box-shadow: var(--cut), 0 0 0 calc(var(--s) * .05) rgba(255, 244, 214, .18);
  transition: transform .15s;
  animation: orbFloat 4s ease-in-out infinite; animation-delay: calc(var(--i) * -1s);
}
.facts.l .orb:nth-child(2) { translate: 4vw 0; } .facts.r .orb:nth-child(1) { translate: -4vw 0; }
.orb:active { transform: scale(.93); }
.orb .tick { position: absolute; right: -10%; top: -10%; width: 40%; height: 40%; display: none;
  filter: drop-shadow(0 .3vmin 0 rgba(18, 10, 48, .6)); }
.orb.heard .tick { display: block; animation: starPop .5s ease-out; }
.orb.heard { border-color: var(--mint); }
.orb.talking { animation: orbTalk .6s ease-in-out infinite alternate; border-color: var(--cream); }
@keyframes orbFloat { 50% { transform: translateY(-1.2vmin); } }
@keyframes orbTalk { from { transform: scale(1); box-shadow: var(--cut), 0 0 0 0 rgba(255, 194, 60, .6); } to { transform: scale(1.1); box-shadow: var(--cut), 0 0 0 2.4vmin rgba(255, 194, 60, 0); } }

.d-bottom { grid-area: bottom; display: flex; align-items: center; gap: 2.5vmin; }
#caption {
  flex: 1; min-height: clamp(54px, 12vmin, 104px); position: relative;
  background: var(--cream); color: var(--dark); border-radius: 4vmin;
  padding: 1.4vmin 3vmin; display: flex; align-items: center; justify-content: center; text-align: center;
  font-size: clamp(16px, 3.8vmin, 32px); line-height: 1.25; font-weight: 600;
  box-shadow: var(--cut);
  max-width: 62ch; margin: 0 auto;
}
#caption::before {
  content: ""; position: absolute; left: 50%; top: -2.2vmin; translate: -50% 0;
  border: 1.4vmin solid transparent; border-bottom: 1.2vmin solid var(--cream); border-top: 0;
}
#caption.talk { animation: capIn .3s ease-out; }
@keyframes capIn { from { transform: scale(.96); } }

/* portrait: planet on top, facts in a row below */
@media (orientation: portrait) {
  #detail {
    grid-template-columns: 1fr 1fr;
    grid-template-rows: auto minmax(0, 1fr) auto auto;
    grid-template-areas: "top top" "planet planet" "fl fr" "bottom bottom";
    row-gap: 2.5vh;
  }
  #bigplanet { width: min(84vw, 48vh); }
  .book-page h2 { font-size: clamp(22px, 6.4vw, 44px); }
  .facts { flex-direction: row; gap: 4vw; }
  .facts.l { justify-content: flex-end; padding-right: 2vw; } .facts.r { justify-content: flex-start; padding-left: 2vw; }
  .facts.l .orb:nth-child(2), .facts.r .orb:nth-child(1) { translate: none; }
  .orb { --s: clamp(64px, 18vw, 130px); }
  .d-name { font-size: clamp(34px, 11vw, 90px); }
}

/* ---------- planet moods + play actions ---------- */
.planet-svg .eyes-happy, .planet-svg .mouth-open, .planet-svg .fx { display: none; }
.planet-svg.happy .eyes-open, .planet-svg.happy .mouth-smile { display: none; }
.planet-svg.happy .eyes-happy, .planet-svg.happy .mouth-open { display: inline; }
.planet-svg.happy-mouth .mouth-smile { display: none; }
.planet-svg.happy-mouth .mouth-open { display: inline; }
.bigsun-svg .eyes-happy, .bigsun-svg .mouth-open { display: none; }
.bigsun-svg.happy .eyes-open, .bigsun-svg.happy .mouth-smile { display: none; }
.bigsun-svg.happy .eyes-happy, .bigsun-svg.happy .mouth-open { display: inline; }
.eye { animation: blink 5.5s infinite; }
@keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 95.5% { transform: scaleY(.1); } }
.surface { animation: roll 38s linear infinite; }
@keyframes roll { to { transform: translateX(-200px); } }
.p-mercury .surface { animation-duration: 22s; }
.p-jupiter .surface, .p-saturn .surface { animation-duration: 26s; }
.p-sun .rays { animation: spin 40s linear infinite; transform-origin: 0 0; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes bob { 50% { transform: translateY(-6%); } }

.planet-svg.play .body { animation: giggle .9s ease-in-out 2; transform-origin: 0 0; }
@keyframes giggle { 0%, 100% { transform: rotate(0) scale(1); } 20% { transform: rotate(-7deg) scale(1.06); } 50% { transform: rotate(6deg) scale(1.03); } 75% { transform: rotate(-3deg) scale(1.05); } }

.planet-svg .fx-speed path, .planet-svg .fx-wind path { fill: none; stroke: var(--cream); stroke-width: 6; stroke-linecap: round; }
.planet-svg.play .fx { display: inline; }
/* Sun: shades drop down */
.p-sun.play .fx-shades { animation: shadesIn .5s cubic-bezier(.3, 1.6, .5, 1) both; }
@keyframes shadesIn { from { transform: translateY(-90px); opacity: 0; } }
.p-sun.play .rays { animation-duration: 3s; }
/* Mercury: dashes off and back */
.p-mercury.play .body, .p-mercury.play .cut-shadow { animation: dash 1.8s ease-in-out; }
@keyframes dash { 0%, 100% { transform: none; } 30% { transform: translateX(28px); } 60% { transform: translateX(-10px); } }
.p-mercury.play .fx-speed { animation: speedLines .3s linear infinite alternate; }
@keyframes speedLines { to { transform: translateX(-12px); opacity: .5; } }
/* Venus: clouds puff in */
.p-venus .fx-clouds g { transform-box: fill-box; transform-origin: center; }
.p-venus.play .fx-clouds g { animation: puff 1.8s ease-out both; }
.p-venus.play .fx-clouds .c2 { animation-delay: .15s; } .p-venus.play .fx-clouds .c3 { animation-delay: .3s; } .p-venus.play .fx-clouds .c4 { animation-delay: .45s; }
.planet-svg.p-venus .fx path { fill: #FFF4D6; stroke: #F2C46B; stroke-width: 3; }
@keyframes puff { 0% { transform: scale(0); } 30% { transform: scale(1.15); } 80% { transform: scale(1); opacity: 1; } 100% { transform: scale(1.2); opacity: 0; } }
/* Earth: the Moon swings round */
.p-earth.play .fx-moon { animation: spin 2.6s ease-in-out; transform-origin: 0 0; }
/* Mars: rover drives over the top */
.p-mars .rover { transform-origin: 0 0; }
.p-mars.play .rover { animation: drive 2.6s ease-in-out both; }
@keyframes drive { from { transform: rotate(-70deg); } to { transform: rotate(70deg); } }
/* Jupiter: storm spins and grows */
.p-jupiter .spot { transform-box: fill-box; transform-origin: center; }
.p-jupiter.play .spot { animation: storm 1.8s ease-in-out; }
.planet-svg.p-jupiter .spot path { stroke: #F7B08F; fill: none; }
@keyframes storm { 50% { transform: scale(1.6) rotate(360deg); } 100% { transform: rotate(720deg); } }
.p-jupiter.play .fx-wind, .p-neptune.play .fx-wind { animation: spin 1.8s linear; transform-origin: 0 0; }
/* Saturn: tilt + sparkles */
.p-saturn.play { animation: tilt 1.8s ease-in-out; }
@keyframes tilt { 25% { transform: rotate(-12deg); } 75% { transform: rotate(10deg); } }
.planet-svg.p-saturn .fx path { stroke: none; fill: #FFF6C8; }
.p-saturn .sp { transform-box: fill-box; transform-origin: center; }
.p-saturn.play .sp { animation: spark .6s ease-in-out infinite alternate; }
.p-saturn.play .sp1, .p-saturn.play .sp3, .p-saturn.play .sp5 { animation-delay: .3s; }
@keyframes spark { from { transform: scale(.2); opacity: .3; } to { transform: scale(1.3); opacity: 1; } }
/* Uranus: a big roll */
.p-uranus.play { animation: rollOver 2s cubic-bezier(.5, 0, .5, 1); }
@keyframes rollOver { 0% { transform: none; } 50% { transform: translateX(14%) rotate(180deg); } 100% { transform: rotate(360deg); } }
/* Neptune: windy wobble */
.p-neptune.play .fx-wind { animation: gust 1s ease-in-out 2; }
@keyframes gust { from { transform: translateX(-40px); opacity: 0; } 50% { opacity: 1; } to { transform: translateX(60px); opacity: 0; } }
.p-neptune.play .body { animation: sway 1s ease-in-out 2; transform-origin: 0 0; }
@keyframes sway { 50% { transform: rotate(10deg) translateX(6px); } }

/* ---------- overlays ---------- */
#hand {
  position: fixed; z-index: 30; width: clamp(56px, 12vmin, 96px); height: clamp(56px, 12vmin, 96px);
  font-size: clamp(48px, 10vmin, 84px); line-height: 1; pointer-events: none; display: none;
  filter: drop-shadow(0 .5vmin 0 rgba(18, 10, 48, .6));
  animation: point 1s ease-in-out infinite;
}
@keyframes point { 50% { transform: translateY(-25%); } }

#sticker {
  position: fixed; inset: 0; z-index: 40; display: none; place-items: center;
  background: rgba(23, 15, 61, .55);
}
#sticker.on { display: grid; }
.sticker-card { position: relative; display: grid; place-items: center; gap: 3vmin; }
.burst {
  position: absolute; left: 50%; top: 42%; width: 95vmin; height: 95vmin; translate: -50% -50%; border-radius: 50%;
  background: repeating-conic-gradient(rgba(255, 194, 60, .28) 0 10deg, transparent 10deg 20deg);
  -webkit-mask: radial-gradient(circle, #000 25%, transparent 68%); mask: radial-gradient(circle, #000 25%, transparent 68%);
  animation: spin 12s linear infinite;
}
.sticker-disc {
  position: relative; width: min(52vmin, 360px); aspect-ratio: 1; border-radius: 50%;
  background: var(--plum-2); border: 2.6vmin solid #fff; display: grid; place-items: center;
  box-shadow: 0 1.4vmin 0 rgba(18, 10, 48, .6);
  animation: stickerIn .7s cubic-bezier(.3, 1.6, .5, 1) both;
}
.sticker-disc .planet-svg { width: 68%; height: 68%; overflow: visible; }
.sticker-text { position: relative; font-size: clamp(26px, 7vmin, 60px); font-weight: 700; color: var(--marigold);
  -webkit-text-stroke: .07em var(--cream); paint-order: stroke fill; text-shadow: 0 .07em 0 var(--ink); }
@keyframes stickerIn { from { transform: scale(0) rotate(-30deg); } to { transform: rotate(-6deg); } }

#book {
  position: fixed; inset: 0; z-index: 35; display: none; place-items: center;
  background: rgba(23, 15, 61, .7);
}
#book.on { display: grid; }
.book-page {
  position: relative; background: var(--cream); color: var(--dark);
  border-radius: 5vmin; padding: 3vmin 4vmin 3.5vmin; box-shadow: 0 1.4vmin 0 rgba(18, 10, 48, .6);
  display: grid; gap: 2vmin; justify-items: center;
  max-width: 96vw; max-height: 94vh;
}
.book-page h2 { margin: 0; padding: 0 clamp(36px, 8vmin, 72px); font-size: clamp(24px, 6vmin, 48px); font-weight: 700; color: var(--plum); white-space: nowrap; }
.book-grid { display: grid; grid-template-columns: repeat(5, auto); gap: 2.4vmin 3vmin; }
@media (orientation: portrait) { .book-grid { grid-template-columns: repeat(3, auto); } }
.slot {
  width: clamp(58px, 15vmin, 120px); aspect-ratio: 1; border-radius: 50%; position: relative;
  display: grid; place-items: center; transform: rotate(var(--r));
}
.slot .planet-svg { width: 70%; height: 70%; overflow: visible; }
.slot.got { background: var(--plum-2); border: 1.2vmin solid #fff; box-shadow: 0 .8vmin 0 rgba(18, 10, 48, .35); }
.slot.empty { border: .6vmin dashed rgba(42, 27, 94, .35); }
.slot.empty .planet-svg { filter: brightness(0); opacity: .14; }
.book-close { position: absolute; right: -2vmin; top: -2vmin; background: var(--bubblegum); }
.reset {
  font-size: clamp(12px, 2.4vmin, 16px); font-weight: 500; color: rgba(34, 20, 63, .6);
  padding: .8vmin 2vmin; border-radius: 99px; position: relative; overflow: hidden;
  border: 2px solid rgba(34, 20, 63, .2);
}
.reset::after { content: ""; position: absolute; inset: 0; background: rgba(255, 92, 154, .35); transform: scaleX(0); transform-origin: left; }
.reset.holding::after { transform: scaleX(1); transition: transform 2s linear; }

.confetti { position: fixed; z-index: 45; width: 4vmin; height: 4vmin; pointer-events: none; left: 0; top: 0; }

#rotate-tip { display: none; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>

<div id="sky" aria-hidden="true"></div>
<button id="shooting" aria-label="Shooting star"></button>

<!-- 1. Intro -->
<section id="intro" class="screen on" aria-label="Start">
  <div class="intro-wrap">
    <h1 class="wordmark" aria-label="Planet Hop"></h1>
    <button id="launchpad" aria-label="Tap the rocket to blast off">
      <div class="ring"></div>
    </button>
    <div class="intro-hint">Tap the rocket to <b>blast off!</b></div>
  </div>
  <div id="countdown" aria-live="polite"></div>
</section>

<!-- 2. Solar system map -->
<section id="map" class="screen" aria-label="Our Solar System">
  <div id="stage">
    <svg id="orbits"></svg>
    <div id="bigsun" role="button" tabindex="0" aria-label="Sun"></div>
    <div id="planets"></div>
    <div id="maprocket" class="idle" role="button" aria-label="Pip the rocket"></div>
  </div>
  <div class="map-title">Our Solar System</div>
  <div class="map-hud">
    <button class="round btn-book" data-open-book aria-label="My sticker book"></button>
    <button class="round btn-sound" data-sound aria-label="Sound on or off"></button>
  </div>
</section>

<!-- 3. Planet close-up -->
<section id="detail" class="screen" aria-label="Planet">
  <div class="d-top">
    <button class="round btn-home" id="homeBtn" aria-label="Back to all the planets"></button>
    <div class="d-title">
      <div class="d-name" id="dname"></div>
      <div class="stars" id="dstars"></div>
    </div>
    <div class="right">
      <button class="round btn-book" data-open-book aria-label="My sticker book"></button>
      <button class="round btn-sound" data-sound aria-label="Sound on or off"></button>
    </div>
  </div>
  <div class="facts l" id="factsL"></div>
  <div class="d-planet"><div id="bigplanet" role="button" tabindex="0" aria-label="Tap the planet"></div></div>
  <div class="facts r" id="factsR"></div>
  <div class="d-bottom">
    <button class="round btn-arrow" id="prevBtn" aria-label="Fly to the planet before"></button>
    <div id="caption" aria-live="polite"></div>
    <button class="round btn-arrow" id="nextBtn" aria-label="Fly to the next planet"></button>
  </div>
</section>

<!-- overlays -->
<div id="hand" aria-hidden="true">👆</div>

<div id="sticker" role="dialog" aria-label="New sticker">
  <div class="sticker-card">
    <div class="burst"></div>
    <div class="sticker-disc" id="stickerDisc"></div>
    <div class="sticker-text" id="stickerText"></div>
  </div>
</div>

<div id="book" role="dialog" aria-label="My sticker book">
  <div class="book-page">
    <button class="round book-close" id="bookClose" aria-label="Close sticker book"></button>
    <h2>My space stickers</h2>
    <div class="book-grid" id="bookGrid"></div>
    <button class="reset" id="resetBtn">Grown-ups: hold to start over</button>
  </div>
</div>

<script src="data.js"></script>
<script src="art.js"></script>
<script src="app.js"></script>
<script>
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
</script>
</body>
</html>
